# Publish the landing page in site/ to Cloudflare Pages.
#
# Its own workflow rather than a job in ci.yml, because it shares nothing with
# it: a change to the page is no reason to run the reader's suite and compile a
# dmg. It does share the compiler, since build:site is a compiled script, so it
# installs what the repository does and is two jobs for the reason webapp.yml is.
#
# Before the first run this needs two repository secrets -- Settings, Secrets
# and variables, Actions:
#
#   CLOUDFLARE_API_TOKEN     a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID    Workers & Pages, in the sidebar on the right
#
# and the Pages project itself, which wrangler will not create for you from CI:
#
#   npx wrangler pages project create redline --production-branch=main
name: Pages

# By hand, or from the release job in ci.yml -- never on a push. build:site
# writes package.json's version into the download button, and package.json is
# ahead of every release from the moment a bump merges until the release job is
# done: a deploy started by a push in that window, to site/ or alongside the
# tag, would link a dmg that is not up yet. So a release deploys the page as its
# last step, after the dmg, the cask and Latest, and any other change to the
# page goes out when somebody chooses Run workflow on main.
on:
  workflow_dispatch:

# A second run lands a second deploy on the same hostname, and the first one's
# answer stops mattering the moment it does. Not cancelled in progress, though:
# a half-finished upload is a worse thing to leave behind than a wasted minute.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything that runs this repository's code and its dependencies' code, and no secret.
  build:
    name: build the landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compiles the script, then runs it. It also fails the run if the page
      # points at a file that is not there, which is the only check available for
      # a page with no browser to open it in -- see the comment at the top of the
      # script.
      - name: Stage the icon and the og:image
        run: npm run build:site

      # What is uploaded is what was built here, to the byte, and the deploy job
      # is not given a checkout to build it again from. The page's TypeScript sits
      # beside what it compiled to, and only the compiled file is the page.
      - uses: actions/upload-artifact@v7
        with:
          name: redline-site
          path: |
            site
            !site/*.ts
          if-no-files-found: error

  # The one job that holds the Cloudflare token. It runs nothing from this
  # repository and nothing from node_modules, only a directory of static files
  # and wrangler: `npm ci` runs every dependency's install scripts, and a job
  # that has done that should not also be handed the key to the account.
  #
  # It has no checkout, so there is no wrangler.toml for `wrangler pages deploy`
  # to find, and the project and the directory are what is written on the command
  # line below -- the same two wrangler.toml names, which the test suite compares.
  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: redline-site
          path: site

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=redline --branch=main
