# The Worker that puts the web app at /app on the landing page's hostname. Its own file, in its
# own directory, so that it is never mistaken for the one at the root of the repository, which is
# the landing page's Pages project. Deployed by hand; docs/building.md, Publishing the web app.
name = "redline-app-route"
main = "app-route.js"
compatibility_date = "2026-10-01"

# Not also on a workers.dev address: that would be a second way into a Worker that is only
# meant to answer one hostname.
workers_dev = false

# `app*` and not `app/*`, so that `/app` and `/app?x` are the Worker's to redirect. The Worker
# itself passes on anything that is not `/app` or under it.
routes = [
  { pattern = "redline.iamtuna.org/app*", zone_name = "iamtuna.org" },
]
